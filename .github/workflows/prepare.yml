name: Prepare Briefing

# Writes the newsletter and uploads it as an artifact for the send job.
#
# Targets 7:30 AM ET on weekdays, half an hour ahead of the 8:00 send.
#
# GitHub cron is UTC only and does not observe daylight saving, so both
# candidate UTC times are registered and a gate job decides which one is
# correct for the current offset.
#
# The gate compares github.event.schedule, the cron expression that actually
# fired, against the current offset. It deliberately does not check the clock
# hour: GitHub routinely starts scheduled runs 10 to 40 minutes late, and an
# hour-equality check rejects those legitimate runs.

on:
  schedule:
    # Three attempts, because the GitHub scheduler drops and delays runs.
    # The first to succeed leaves a marker and the rest stand down.
    - cron: '0 11 * * 1-5'    # 7:00 ET on EDT
    - cron: '15 11 * * 1-5'   # 7:15 ET on EDT
    - cron: '30 11 * * 1-5'   # 7:30 ET on EDT
    - cron: '0 12 * * 1-5'    # 7:00 ET on EST
    - cron: '15 12 * * 1-5'   # 7:15 ET on EST
    - cron: '30 12 * * 1-5'   # 7:30 ET on EST
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even on a weekend (for testing)'
        type: boolean
        default: false
  repository_dispatch:
    types: [trigger-prepare]

permissions:
  contents: read
  actions: write

jobs:
  # A separate job so the off-season cron shows as a clean skip rather than a
  # red failure.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # One prepare per day. Without this the redundant crons would each write
      # a full issue and burn three times the model allowance.
      - id: duplicate
        name: Has today's issue already been written?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          FOUND=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq "[.artifacts[] | select(.expired == false) | select(.name == \"prepared-$TODAY\")] | length" \
            2>/dev/null || echo 0)
          echo "Marker prepared-$TODAY found: ${FOUND:-0}"
          if [ "${FOUND:-0}" -gt 0 ]; then
            echo "already_done=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_done=false" >> "$GITHUB_OUTPUT"
          fi

      - id: check
        name: Should this trigger run?
        run: |
          if [ "${{ steps.duplicate.outputs.already_done }}" = "true" ]; then
            echo "Today's issue is already written. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual or dispatch trigger. Proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every cron here targets the same ET hour and only the UTC hour
          # differs by season, so match on the hour. That lets all the
          # redundant attempts qualify during their own season.
          OFFSET=$(TZ=America/New_York date +%z)
          if [ "$OFFSET" = "-0400" ]; then
            EXPECTED_HOUR=11
          else
            EXPECTED_HOUR=12
          fi

          ACTUAL='${{ github.event.schedule }}'
          ACTUAL_HOUR=$(echo "$ACTUAL" | awk '{print $2}')
          echo "New York offset:   $OFFSET"
          echo "Expected UTC hour: $EXPECTED_HOUR"
          echo "Triggering cron:   $ACTUAL (hour $ACTUAL_HOUR)"

          if [ "$ACTUAL_HOUR" = "$EXPECTED_HOUR" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off-season cron for the current offset. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Aggregate, write, and render
        timeout-minutes: 50
        env:
          # Subscription-billed generation. Generate the token locally with
          # `claude setup-token` and store it as a repository secret.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_BACKEND: cli
          CLAUDE_CLI_MODEL: sonnet
          # No ANTHROPIC_API_KEY is passed, and LLM_ALLOW_API_FALLBACK stays
          # unset, so this job has no path to metered billing. If subscription
          # auth fails it ships the deterministic edition instead.
          CLAUDE_MAX_TOKENS: "8192"
          BRIEFING_MODE: newsletter
          VERIFY_SECTIONS: "true"
          WEEKDAYS_ONLY: ${{ inputs.force_run && 'false' || 'true' }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TIMEZONE: America/New_York
        run: python main.py --prepare-only

      # Stamps the build date into the artifact so the send job can refuse a
      # stale one rather than mailing out yesterday's issue.
      - name: Stamp the build date
        run: TZ=America/New_York date +%Y-%m-%d > briefing_date.txt

      - id: today
        name: Date the run
        run: |
          echo "date=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          cp briefing_date.txt prepared-marker.txt

      - name: Mark today as written
        uses: actions/upload-artifact@v4
        with:
          name: prepared-${{ steps.today.outputs.date }}
          path: prepared-marker.txt
          retention-days: 2
          if-no-files-found: warn

      - name: Upload briefing
        uses: actions/upload-artifact@v4
        with:
          name: briefing-ready
          path: |
            briefing_ready.html
            briefing_subject.txt
            briefing_date.txt
          retention-days: 2
          if-no-files-found: warn
