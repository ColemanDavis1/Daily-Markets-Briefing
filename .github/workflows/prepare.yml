name: Prepare Briefing

# Writes the newsletter and uploads it as an artifact for the send job.
#
# Targets 6:40 AM ET on weekdays. GitHub cron is UTC only and does not observe
# daylight saving, so both candidate UTC times are registered and a gate job
# decides which one is correct for the current offset.
#
# The gate compares github.event.schedule, the cron expression that actually
# fired, against the current offset. It deliberately does not check the clock
# hour: GitHub routinely starts scheduled runs 10 to 40 minutes late, and an
# hour-equality check rejects those legitimate runs.

on:
  schedule:
    - cron: '40 10 * * 1-5'   # 6:40 ET while New York is on EDT (UTC-4)
    - cron: '40 11 * * 1-5'   # 6:40 ET while New York is on EST (UTC-5)
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even on a weekend (for testing)'
        type: boolean
        default: false
  repository_dispatch:
    types: [trigger-prepare]

permissions:
  contents: read
  actions: write

jobs:
  # A separate job so the off-season cron shows as a clean skip rather than a
  # red failure.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        name: Is this the right cron for the current DST offset?
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual or dispatch trigger. Proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET=$(TZ=America/New_York date +%z)
          if [ "$OFFSET" = "-0400" ]; then
            EXPECTED='40 10 * * 1-5'
          else
            EXPECTED='40 11 * * 1-5'
          fi

          ACTUAL='${{ github.event.schedule }}'
          echo "New York offset: $OFFSET"
          echo "Expected cron:   $EXPECTED"
          echo "Triggering cron: $ACTUAL"

          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off-season cron for the current offset. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Aggregate, write, and render
        timeout-minutes: 50
        env:
          # Subscription-billed generation. Generate the token locally with
          # `claude setup-token` and store it as a repository secret.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_BACKEND: cli
          CLAUDE_CLI_MODEL: sonnet
          # No ANTHROPIC_API_KEY is passed, and LLM_ALLOW_API_FALLBACK stays
          # unset, so this job has no path to metered billing. If subscription
          # auth fails it ships the deterministic edition instead.
          CLAUDE_MAX_TOKENS: "8192"
          BRIEFING_MODE: newsletter
          VERIFY_SECTIONS: "true"
          WEEKDAYS_ONLY: ${{ inputs.force_run && 'false' || 'true' }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TIMEZONE: America/New_York
        run: python main.py --prepare-only

      # Stamps the build date into the artifact so the send job can refuse a
      # stale one rather than mailing out yesterday's issue.
      - name: Stamp the build date
        run: TZ=America/New_York date +%Y-%m-%d > briefing_date.txt

      - name: Upload briefing
        uses: actions/upload-artifact@v4
        with:
          name: briefing-ready
          path: |
            briefing_ready.html
            briefing_subject.txt
            briefing_date.txt
          retention-days: 2
          if-no-files-found: warn
