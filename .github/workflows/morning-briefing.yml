name: Morning Briefing

# Sends the newsletter prepared by prepare.yml.
#
# Targets 7:00 AM ET on weekdays. Both DST candidate crons are registered and
# the gate job picks the correct one for the current offset. See prepare.yml for
# why the gate matches on the cron expression rather than the clock hour.

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 7:00 ET while New York is on EDT (UTC-4)
    - cron: '0 12 * * 1-5'   # 7:00 ET while New York is on EST (UTC-5)
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even on a weekend (for testing)'
        type: boolean
        default: false
  repository_dispatch:
    types: [trigger-send]

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        name: Is this the right cron for the current DST offset?
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual or dispatch trigger. Proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET=$(TZ=America/New_York date +%z)
          if [ "$OFFSET" = "-0400" ]; then
            EXPECTED='0 11 * * 1-5'
          else
            EXPECTED='0 12 * * 1-5'
          fi

          ACTUAL='${{ github.event.schedule }}'
          echo "New York offset: $OFFSET"
          echo "Expected cron:   $EXPECTED"
          echo "Triggering cron: $ACTUAL"

          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off-season cron for the current offset. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  send-briefing:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Only today's artifact is acceptable. Without this date check the step
      # downloads the newest successful prepare from any previous day and mails
      # a stale issue, which is what happened on 2026-08-24.
      - name: Download today's prepared briefing
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          RUN_ID=$(gh run list \
            --workflow=prepare.yml \
            --status=success \
            --limit=5 \
            --json=databaseId \
            --jq='.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful prepare run found."
            exit 1
          fi

          gh run download "$RUN_ID" --name briefing-ready --dir . || {
            echo "Artifact download failed for run $RUN_ID."
            exit 1
          }

          if [ ! -f briefing_date.txt ]; then
            echo "Artifact carries no build date. Treating it as stale."
            exit 1
          fi

          BUILT=$(tr -d '[:space:]' < briefing_date.txt)
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          echo "Artifact built: $BUILT"
          echo "Today:          $TODAY"

          if [ "$BUILT" != "$TODAY" ]; then
            echo "Artifact is from $BUILT, not today. Refusing to send it."
            exit 1
          fi

          echo "Fresh artifact from prepare run $RUN_ID."

      - name: Send it
        if: steps.download.outcome == 'success'
        timeout-minutes: 5
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          WEEKDAYS_ONLY: ${{ inputs.force_run && 'false' || 'true' }}
          TIMEZONE: America/New_York
        run: python main.py --send-only

      # No fresh artifact, so build and send in one pass rather than skipping
      # the morning or mailing something stale.
      - name: Fallback, build and send in one pass
        if: steps.download.outcome == 'failure'
        timeout-minutes: 55
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_BACKEND: cli
          CLAUDE_CLI_MODEL: sonnet
          CLAUDE_MAX_TOKENS: "8192"
          BRIEFING_MODE: newsletter
          VERIFY_SECTIONS: "true"
          WEEKDAYS_ONLY: ${{ inputs.force_run && 'false' || 'true' }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          TIMEZONE: America/New_York
        run: |
          echo "No fresh artifact for today. Building from scratch."
          rm -f briefing_ready.html briefing_subject.txt briefing_date.txt
          npm install -g @anthropic-ai/claude-code
          python main.py
