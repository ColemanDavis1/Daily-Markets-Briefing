name: Morning Briefing

# Sends the newsletter prepared by prepare.yml.
#
# Runs at 7:00 AM ET on weekdays. Both DST candidate times fire and a guard
# step exits the one that is not actually 7 AM in New York.

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 7:00 ET during EDT
    - cron: '0 12 * * 1-5'   # 7:00 ET during EST
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-send]

permissions:
  contents: read
  actions: read

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Skip the duplicate DST run
        if: github.event_name == 'schedule'
        run: |
          ET_HOUR=$(TZ=America/New_York date +%H)
          echo "Current New York hour: $ET_HOUR"
          if [ "$ET_HOUR" != "07" ]; then
            echo "Not 7 AM in New York. This is the off-season cron. Exiting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download the prepared briefing
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --workflow=prepare.yml \
            --status=success \
            --limit=1 \
            --json=databaseId \
            --jq='.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful prepare run found."
            exit 1
          fi
          gh run download "$RUN_ID" --name briefing-ready --dir .
          echo "Downloaded from prepare run $RUN_ID"

      - name: Send it
        if: steps.download.outcome == 'success'
        timeout-minutes: 5
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          WEEKDAYS_ONLY: "true"
          TIMEZONE: America/New_York
        run: python main.py --send-only

      # If prepare never ran or failed, build and send in one pass rather than
      # skipping the morning entirely.
      - name: Fallback, build and send in one pass
        if: steps.download.outcome == 'failure'
        timeout-minutes: 55
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_BACKEND: cli
          CLAUDE_CLI_MODEL: sonnet
          CLAUDE_MAX_TOKENS: "8192"
          BRIEFING_MODE: newsletter
          VERIFY_SECTIONS: "true"
          WEEKDAYS_ONLY: "true"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          TIMEZONE: America/New_York
        run: |
          echo "No prepared artifact. Running the full pipeline."
          npm install -g @anthropic-ai/claude-code
          python main.py
