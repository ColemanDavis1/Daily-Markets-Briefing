name: Morning Briefing

# Sends the newsletter prepared by prepare.yml.
#
# Delivers at 8:00 AM ET on weekdays.
#
# GitHub's scheduler is best-effort and has started this workflow anywhere from
# on time to ten hours late, so the cron alone cannot hold a consistent hour.
# Three things compensate:
#
#   1. The cron is set for 7:50 ET and the job holds until 8:00 sharp, so an
#      on-time or early start delivers exactly on the hour.
#   2. A repository_dispatch from an external scheduler can trigger the same
#      workflow at a precise time, which is far more reliable than GitHub cron.
#   3. A send marker prevents a duplicate email when both of those fire.

on:
  schedule:
    # Several attempts, all ahead of 8:00 ET. Each holds until 8:00 sharp,
    # and the send marker means only the first one through mails anything.
    - cron: '20 11 * * 1-5'   # 7:20 ET on EDT
    - cron: '35 11 * * 1-5'   # 7:35 ET on EDT
    - cron: '50 11 * * 1-5'   # 7:50 ET on EDT
    - cron: '20 12 * * 1-5'   # 7:20 ET on EST
    - cron: '35 12 * * 1-5'   # 7:35 ET on EST
    - cron: '50 12 * * 1-5'   # 7:50 ET on EST
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even on a weekend (for testing)'
        type: boolean
        default: false
  repository_dispatch:
    types: [trigger-send]

permissions:
  contents: read
  actions: write   # the send marker is stored as an artifact

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # The external dispatcher and the GitHub cron can both fire on the same
      # morning. Whichever gets there first leaves a dated marker artifact, and
      # the other one stops here rather than sending a second copy.
      - id: duplicate
        name: Has today's issue already gone out?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          FOUND=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100"             --jq "[.artifacts[] | select(.expired == false) | select(.name == \"sent-$TODAY\")] | length"             2>/dev/null || echo 0)
          echo "Marker sent-$TODAY found: $FOUND"
          if [ "${FOUND:-0}" -gt 0 ]; then
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
          fi

      - id: check
        name: Is this the right cron for the current DST offset?
        run: |
          if [ "${{ steps.duplicate.outputs.already_sent }}" = "true" ]; then
            echo "Today's issue has already been delivered. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual or dispatch trigger. Proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every cron here targets the same ET hour and only the UTC hour
          # differs by season, so match on the hour rather than the minute.
          OFFSET=$(TZ=America/New_York date +%z)
          if [ "$OFFSET" = "-0400" ]; then
            EXPECTED_HOUR=11
          else
            EXPECTED_HOUR=12
          fi

          ACTUAL='${{ github.event.schedule }}'
          ACTUAL_HOUR=$(echo "$ACTUAL" | awk '{print $2}')
          echo "New York offset:   $OFFSET"
          echo "Expected UTC hour: $EXPECTED_HOUR"
          echo "Triggering cron:   $ACTUAL (hour $ACTUAL_HOUR)"

          if [ "$ACTUAL_HOUR" = "$EXPECTED_HOUR" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off-season cron for the current offset. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  send-briefing:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Land on the hour. A run that starts early waits; a run that is already
      # late proceeds immediately rather than waiting until tomorrow.
      - name: Hold until 8:00 AM ET
        run: |
          TARGET=$(TZ=America/New_York date -d 'today 08:00' +%s)
          NOW=$(date +%s)
          WAIT=$(( TARGET - NOW ))
          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 3000 ]; then
            echo "Holding ${WAIT}s to deliver at 8:00 AM ET."
            sleep "$WAIT"
          else
            echo "No hold needed (offset ${WAIT}s from 8:00 ET)."
          fi
          echo "Sending at $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')."

      # Only today's artifact is acceptable. Without this date check the step
      # downloads the newest successful prepare from any previous day and mails
      # a stale issue, which is what happened on 2026-08-24.
      - name: Download today's prepared briefing
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          RUN_ID=$(gh run list \
            --workflow=prepare.yml \
            --status=success \
            --limit=5 \
            --json=databaseId \
            --jq='.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful prepare run found."
            exit 1
          fi

          gh run download "$RUN_ID" --name briefing-ready --dir . || {
            echo "Artifact download failed for run $RUN_ID."
            exit 1
          }

          if [ ! -f briefing_date.txt ]; then
            echo "Artifact carries no build date. Treating it as stale."
            exit 1
          fi

          BUILT=$(tr -d '[:space:]' < briefing_date.txt)
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          echo "Artifact built: $BUILT"
          echo "Today:          $TODAY"

          if [ "$BUILT" != "$TODAY" ]; then
            echo "Artifact is from $BUILT, not today. Refusing to send it."
            exit 1
          fi

          echo "Fresh artifact from prepare run $RUN_ID."

      - name: Send it
        if: steps.download.outcome == 'success'
        timeout-minutes: 5
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          WEEKDAYS_ONLY: ${{ inputs.force_run && 'false' || 'true' }}
          TIMEZONE: America/New_York
        run: python main.py --send-only

      # No fresh artifact, so build and send in one pass rather than skipping
      # the morning or mailing something stale.
      - name: Fallback, build and send in one pass
        if: steps.download.outcome == 'failure'
        timeout-minutes: 55
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_BACKEND: cli
          CLAUDE_CLI_MODEL: sonnet
          CLAUDE_MAX_TOKENS: "8192"
          BRIEFING_MODE: newsletter
          VERIFY_SECTIONS: "true"
          WEEKDAYS_ONLY: ${{ inputs.force_run && 'false' || 'true' }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          TIMEZONE: America/New_York
        run: |
          echo "No fresh artifact for today. Building from scratch."
          rm -f briefing_ready.html briefing_subject.txt briefing_date.txt
          npm install -g @anthropic-ai/claude-code
          python main.py

      # Marks the day as delivered so a later trigger does not send a second
      # copy. Written only when one of the two send paths actually ran.
      - id: today
        if: success() && (steps.download.outcome == 'success' || steps.download.outcome == 'failure')
        run: |
          echo "date=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          TZ=America/New_York date +%Y-%m-%d > sent-marker.txt

      - name: Record that today's issue was delivered
        if: success() && steps.today.outputs.date != ''
        uses: actions/upload-artifact@v4
        with:
          name: sent-${{ steps.today.outputs.date }}
          path: sent-marker.txt
          retention-days: 2
          if-no-files-found: warn
